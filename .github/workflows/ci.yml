name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile (lint)
        run: python -m compileall -q src tools
      - name: Repo checks
        run: |
          if [ -f tools/check_all.sh ]; then bash tools/check_all.sh; fi

  test-fast:
    # DR-0009 fast-lane backstop (#89): exercises tools/test_fast.sh's own
    # `-k` selection syntax in CI so a break there (e.g. a typo'd keyword
    # that silently narrows the suite to zero tests) cannot ship uncaught.
    # Single Python version is enough — this job's purpose is validating the
    # fast-lane script itself, not full version coverage (the `test` job
    # above already matrices 3.11/3.12/3.13 for that).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fast-lane tests (DR-0009)
        run: make test-fast

  mermaid:
    # README mermaid blocks must render: a syntax error here breaks the GitHub
    # rich display of the whole README (regression fixed 2026-09-20).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Extract mermaid blocks from README.md
        run: |
          mkdir -p .mermaid-ci
          python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("README.md").read_text()
          blocks = re.findall(r"```mermaid\n(.*?)```", text, re.S)
          if not blocks:
              raise SystemExit("no ```mermaid blocks found in README.md")
          for i, block in enumerate(blocks):
              pathlib.Path(f".mermaid-ci/block-{i}.mmd").write_text(block)
          print(f"extracted {len(blocks)} mermaid block(s)")
          PY
      - name: Render every mermaid block (pinned mermaid-cli)
        run: |
          printf '{\n  "args": ["--no-sandbox", "--disable-gpu"]\n}\n' > .mermaid-ci/puppeteer.json
          for f in .mermaid-ci/block-*.mmd; do
            echo "== validating $f"
            npx -y @mermaid-js/mermaid-cli@11 -p .mermaid-ci/puppeteer.json -i "$f" -o "${f%.mmd}.svg"
          done

  dag-fresh:
    # Staleness guard: the committed README block must equal a fresh render
    # (tools/render_issue_dag.py runs its own mermaid lint before comparing).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: README issue-DAG block is fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/render_issue_dag.py --check

  capabilities-fresh:
    # C01 (issue #45): generated capability views must equal a fresh compile
    # from the committed graph + evidence. Evaluation never executes checks;
    # a covered-byte change or a hand-edited view fails here. (--strict, the
    # every-node-PASS release gate, is deliberately NOT run yet: most nodes
    # are honestly NO_VERDICT until their claims are evidenced.)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Capability views are fresh (compile_capabilities --check)
        run: python3 tools/compile_capabilities.py --check

  signoff-fresh:
    # T1 items 9 and 10 (issue #149): the committed klt signoff record and the
    # two attestation envelopes must reproduce. `--attest --check` re-runs the
    # inventories' commands (so this job installs the simulators the benches
    # need) and fails on any drift in an inventory, an inventoried file, a
    # check outcome or the committed envelope. See signoff/README.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Simulators for the item 9 cold start
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog verilator
      - name: Item 9 cold start, direct (surfaces the bench output klt hides)
        # klt prints none of the script's output; run it once here so a failing
        # bench or a simulator-version mismatch is visible in the log.
        run: |
          python3 tools/h01_compare.py --skip-mutate --outdir "$RUNNER_TEMP/h01" || true
          bash signoff/cold-start-benches.sh
      - name: Install the pinned klt grading build
        run: pip install "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@7ee09483b74867a47a05eb353015c2cf5ca33ef3"
      - name: Item 9 attestation reproduces
        run: klt signoff --attest 9 --inventory signoff/inventory-item9.json --check signoff/evidence/item9.json
      - name: Item 10 attestation reproduces
        run: klt signoff --attest 10 --inventory signoff/inventory-item10.json --check signoff/evidence/item10.json
      - name: Committed signoff report reproduces
        # Exit 3 here means drift. The report's own T1 verdict is not a CI
        # failure: the block is honestly not T1 (items 1-8, 11 uncited).
        run: klt signoff --manifest signoff/manifest.json --tiers-doc signoff/design-evidence-tiers.md --check signoff/signoff.json
