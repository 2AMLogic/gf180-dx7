name: dag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Regenerate README issue-DAG block
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/render_issue_dag.py
      - name: Commit regenerated view (never force-push)
        run: |
          if git diff --quiet README.md; then
            echo "README up to date"
          else
            git config user.name "loom-dag-bot"
            git config user.email "actions@users.noreply.github.com"
            git add README.md
            git commit -m "dag: regenerate README issue-DAG view [skip ci]"
            git push
          fi
